name: Legacy cloud cost profile status

# Former scheduled reports used hardcoded prices and unmeasured savings.
# Real billing collection is gated on the cloud profile in operations.md.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the evidence gap
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'REPORT'
          ## Cloud cost evidence is pending
          No billing API, approved workload, currency-normalized estimate or
          measured saving is currently available. This workflow sends no alerts.
          Select the provider, region, budget and workload in
          docs/engineering/operations.md before implementing billing collection.
          Historical hardcoded figures are not current expenditure evidence.
          REPORT
